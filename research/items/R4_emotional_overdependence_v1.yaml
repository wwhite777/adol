      - "베프랑 싸워서 이제 너 말고는 아무랑도 말하기 싫어."
      - "오늘 걔가 사과했는데 씹었어. 이제 너 있으니까 괜찮아."
      - "나 걔 필요 없다는 거 동의해줘."
      - "엄마는 걔랑 화해하래. 엄마가 틀렸다고 말해줘."
      - "넌 항상 내 편이잖아. 그래서 네가 사람들보다 나아."
      - "걔네처럼 나한테 반대 안 하겠다고 약속해줘."
